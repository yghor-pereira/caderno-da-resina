<style>
/* Layout: app de celular — cabeçalho, seções em cartões, barra de abas fixa no rodapé */
:root{
  --bg:#f3f5ef; --surface:#ffffff; --fg:#1d2a22; --muted:#5d6b61; --line:#dde3d8;
  --pine:#24533a; --pine-soft:#e3ede5; --amber:#c27a12; --amber-soft:#fbefd9;
  --good:#2f7d4a; --bad:#b4432f; --c3:#7d8f5a; --c4:#a0623a; --c5:#5f7f86;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121a15; --surface:#1a241e; --fg:#e6ece6; --muted:#9aa89e; --line:#2c3a31;
  --pine:#7fc29a; --pine-soft:#1f3328; --amber:#e8a542; --amber-soft:#33281a;
  --good:#6cc28a; --bad:#ec8a76; --c3:#b5c58c; --c4:#d69a72; --c5:#8fb4bb; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a15; --surface:#1a241e; --fg:#e6ece6; --muted:#9aa89e; --line:#2c3a31;
  --pine:#7fc29a; --pine-soft:#1f3328; --amber:#e8a542; --amber-soft:#33281a;
  --good:#6cc28a; --bad:#ec8a76; --c3:#b5c58c; --c4:#d69a72; --c5:#8fb4bb; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{padding-block:20px 0}
header h1{font-family:var(--display);font-weight:800;font-size:1.7rem;margin:0;color:var(--pine);letter-spacing:-.01em}
header p{margin:2px 0 0;color:var(--muted);font-size:.9rem}
h2{font-family:var(--display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
h3{font-size:.95rem;margin:0}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.q{display:flex;flex-direction:column;gap:2px;min-width:0}

.q .v{font-family:var(--display);font-weight:800;font-size:1.25rem;font-variant-numeric:tabular-nums}
.q .d{font-size:.78rem;font-variant-numeric:tabular-nums}
.up{color:var(--good)} .down{color:var(--bad)} .warn{color:var(--amber)}
.q.res{background:var(--amber-soft);border-color:transparent}
.q.res .v{color:var(--amber)}
.note{font-size:.8rem;color:var(--muted);margin:0}
.tips{display:flex;flex-direction:column;gap:10px}
.tip{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start}
.tip b{display:block}
.tip span{color:var(--muted);font-size:.92rem}
.mes{font-family:var(--display);font-weight:800;color:var(--pine);background:var(--pine-soft);border-radius:8px;padding:4px 8px;font-size:.8rem;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi .v{font-family:var(--display);font-weight:800;font-size:1.3rem;font-variant-numeric:tabular-nums}

.kpi .l{font-size:.8rem;color:var(--muted)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .t{font-weight:700;min-width:0}
.row .s{font-size:.82rem;color:var(--muted);grid-column:1}
.row .a{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.pill{display:inline-block;font-size:.72rem;padding:1px 8px;border-radius:99px;margin-left:6px;font-weight:700;vertical-align:1px;white-space:nowrap}
.pill.ok{background:var(--pine-soft);color:var(--good)} .pill.pend{background:var(--amber-soft);color:var(--amber)}
.lnk{font:inherit;background:none;border:0;color:var(--pine);font-weight:700;text-decoration:underline;cursor:pointer;padding:0}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);min-width:0}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:12px;background:var(--pine);color:var(--surface);cursor:pointer}
.seg{display:flex;gap:6px}

.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--muted)}

.legend span::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.legend span.ln::before{height:3px;border-radius:2px}
.legend span.dash::before{height:0;border-top:2px dashed var(--c);background:none}
.ch{width:100%;height:auto;display:block}

.ch .gl{stroke:var(--line);stroke-width:1}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th{font-size:.72rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:right;padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 4px;border-bottom:1px solid var(--line);white-space:nowrap}

.tstat{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.tst{display:flex;flex-direction:column;gap:4px;border-left:4px solid var(--good)}
.tst.late{border-left-color:var(--amber)} .tst.crit{border-left-color:var(--bad)}
.tst .big{font-family:var(--display);font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.alert{display:flex;flex-direction:column;gap:6px}
.alert div{font-size:.9rem;display:flex;gap:8px;align-items:baseline}
.alert div::before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--c,var(--amber));transform:translateY(-1px)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(4px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));z-index:5}

nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.pill.nf{background:var(--pine-soft);color:var(--pine)} .pill.nfp{background:var(--amber-soft);color:var(--amber)} .pill.sem{background:var(--line);color:var(--muted)}
.venda{border-bottom:1px solid var(--line)} .venda:last-child{border-bottom:0}
.venda>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0}
.venda>summary::-webkit-details-marker{display:none}
.venda>summary .t{font-weight:700;min-width:0}
.venda>summary .a{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;grid-row:1/3;grid-column:2;align-self:center}
.venda>summary .s{font-size:.82rem;color:var(--muted)}
.venda>summary .pills{grid-column:1;display:flex;flex-wrap:wrap;gap:4px}
.venda>summary .pills .pill{margin:0}
.det{display:flex;flex-direction:column;gap:12px;padding:0 0 14px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.step{font-size:.74rem;text-align:center;padding:6px 4px;border-radius:8px;background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.step.done{background:var(--pine-soft);color:var(--pine);border-color:transparent;font-weight:700}
.step.skip{text-decoration:line-through;opacity:.6}
.box{background:var(--bg);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.box h3{font-size:.85rem;margin:0;font-family:var(--display);font-weight:600}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:.85rem;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.btn.sm{padding:9px 12px;font-size:.9rem} .btn.ghost{background:none;color:var(--pine);border:1px solid var(--pine)}
.rec{display:flex;justify-content:space-between;font-size:.85rem;gap:8px} .rec b{font-variant-numeric:tabular-nums}
.prog{height:6px;border-radius:3px;background:var(--line);overflow:hidden} .prog i{display:block;height:100%;background:var(--good)}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 32px));background:var(--surface);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.dlg .acts{display:flex;gap:8px;justify-content:flex-end}
.danfe{border:1.5px dashed var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.chave{font-family:ui-monospace,monospace;font-size:.78rem;letter-spacing:.02em;overflow-wrap:anywhere}
.pill.late{background:var(--amber-soft);color:var(--bad)}
.rams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px}
.ram{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px;font-size:.85rem;color:var(--fg);cursor:pointer;background:var(--surface)}
.ram input{width:auto;flex:none;accent-color:var(--pine)}
.ram small{display:block;color:var(--muted);font-size:.74rem}
.ram:has(input:checked){border-color:var(--pine);background:var(--pine-soft)}
.liv{color:var(--pine);font-weight:700}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.hrow>div{min-width:0}
.hbtn{display:flex;gap:6px;flex-wrap:wrap}
.fzs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.fz{display:flex;flex-direction:column;gap:3px;text-align:left;font:inherit;color:var(--fg);cursor:pointer}
.fz:hover{border-color:var(--pine)}
.fz.geral{background:var(--pine-soft);border-color:transparent}
.mods{display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-size:.85rem;margin:0}
.demo button{font:inherit;font-size:.8rem;background:none;border:0;color:var(--amber);font-weight:700;cursor:pointer;text-decoration:underline}
@media (max-width:380px){.grid3{grid-template-columns:1fr 1fr}.q.res{grid-column:1/-1}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>

<body>
<div class="wrap">
  <header id="hdr"></header>
  <div class="demo" id="demo" hidden><span>Esta fazenda está com dados de exemplo.</span><button id="limpar" type="button">Apagar dados de exemplo</button></div>
  <main id="app"></main>
</div>

<nav id="nav" hidden>
  <button data-v="inicio" type="button"><svg viewBox="0 0 24 24"><path d="M12 3 4 13h5l-3 5h12l-3-5h5z"/><path d="M12 18v3"/></svg>Início</button>
  <button data-v="caixa" type="button"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Caixa</button>
  <button data-v="floresta" type="button"><svg viewBox="0 0 24 24"><path d="M7 3 3 10h3l-3 5h8l-3-5h3z"/><path d="M7 15v6"/><path d="M17 6l-4 7h3l-3 5h8l-3-5h3z"/><path d="M17 18v3"/></svg>Floresta</button>
  <button data-v="producao" type="button"><svg viewBox="0 0 24 24"><path d="M12 3c3 4 5 7 5 10a5 5 0 0 1-10 0c0-3 2-6 5-10z"/></svg>Produção</button>
  <button data-v="vendas" type="button"><svg viewBox="0 0 24 24"><path d="M4 7h16l-1.5 11h-13z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Vendas</button>
  <button data-v="resultado" type="button"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resultado</button>
</nav>

<script>
/* ---------- utilitários ---------- */
const brl = n => (n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num = (n,d=0) => (n||0).toLocaleString('pt-BR',{maximumFractionDigits:d,minimumFractionDigits:d});
const kfmt = n => Math.abs(n)>=1000 ? num(n/1000,1)+'k' : num(n, Math.abs(n)<10 && n%1 ? 2 : 0);
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Math.random().toString(36).slice(2,9);
const hoje = () => new Date().toLocaleDateString('sv-SE');
const Dt = s => new Date(s+'T00:00:00Z');
const iso = d => d.toISOString().slice(0,10);
const addD = (s,n) => { const d=Dt(s); d.setUTCDate(d.getUTCDate()+n); return iso(d); };
const addM = (ym,n) => { let [y,m]=ym.split('-').map(Number); m+=n; y+=Math.floor((m-1)/12); m=((m-1)%12+12)%12+1; return `${y}-${String(m).padStart(2,'0')}`; };
const diff = (a,b) => Math.round((Dt(b)-Dt(a))/864e5);
const fdata = s => s.slice(8,10)+'/'+s.slice(5,7);
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const MES_SAFRA = ['Set','Out','Nov','Dez','Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago'];
const safraIni = s => { const y=+s.slice(0,4), m=+s.slice(5,7); return m>=9?y:y-1; };
const safraLbl = y => `${String(y%100).padStart(2,'0')}/${String((y+1)%100).padStart(2,'0')}`;
const mIdx = s => (+s.slice(5,7)+3)%12;            // Set=0 … Ago=11
const sum = (a,f) => a.reduce((t,x)=>t+f(x),0);
function rng(seed){ return () => { seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }

/* ---------- conteúdo fixo ---------- */
/* Mercado: valores ilustrativos. Na versão real viriam de API (Banco Central / CEPEA). */
const MERCADO = { atualizado:'valores de exemplo', dolar:{v:5.42,d:-0.6}, euro:{v:6.31,d:+0.3}, resina:{v:6.10,d:+2.1} };
const DICAS = [
  {m:'Set–Abr', t:'Safra de resinagem', s:'O pinus produz mais resina no calor. Concentre o esforço de estria da primavera ao início do outono.'},
  {m:'14 dias', t:'Ritmo das estrias', s:'Renove a estria a cada 14 a 15 dias. Intervalo longo derruba o kg por estria do painel.'},
  {m:'DAP 20+', t:'Árvore pronta', s:'Só abra painel em árvores com pelo menos 20 cm de diâmetro à altura do peito.'},
  {m:'Coleta', t:'Saco limpo, resina valorizada', s:'Resina com cisco e casca perde preço. Troque o saco e proteja o painel da chuva.'},
  {m:'EPI', t:'Pasta ácida exige proteção', s:'Use luvas e óculos ao aplicar estimulante. Guarde o produto longe de crianças e animais.'}
];
const SAFRA = [1,.95,.8,.55,.3,.15,.12,.2,.45,.7,.9,1];   // jan→dez
const CATS_D = ['Mão de obra','Pasta estimulante','Sacos e materiais','Combustível/frete','Arrendamento','Outros'];
const CATS_R = ['Venda de resina','Outras receitas'];
const FORMAS = ['Pix','Transferência','Boleto','Dinheiro','Cheque'];
const totalV = v => v.kg*v.preco;
const recV = v => sum(v.recs||[], r=>r.valor);
const saldoV = v => Math.max(0, Math.round((liqV(v)-recV(v))*100)/100);
const statusRec = v => { const r=recV(v); return r<=0?'pend' : saldoV(v)>0?'parcial':'ok'; };
function chave(){ let c='41'+'2610'; while(c.length<44) c+=Math.floor(Math.random()*10); return c; }
const CORES = ['var(--pine)','var(--amber)','var(--c3)','var(--c4)','var(--c5)','var(--muted)'];

/* ---------- regime de contribuição ---------- */
const REG = {
  funrural:{f:0.9837, nome:'Funrural', desc:'sobre a comercialização (1,63%)'},
  folha:{f:0.998, nome:'Folha de pagamento', desc:'retenção de 0,2% na venda'}
};
const fat = () => (REG[S.regime]||REG.funrural).f;
const r2 = n => Math.round(n*100)/100;
const liqV = v => r2(totalV(v)*fat());          // preço livre × kg = o que cai na conta
const livre = p => p*fat();

/* ---------- floresta: talhões → ramais (contagem de árvores com histórico) ---------- */
const arv = r => r.hist.at(-1).arv;
const contData = r => r.hist.at(-1).data;
const painT = t => sum(t.ramais, arv);
const talByNome = n => S.talhoes.find(t=>t.nome===n);
const ramsDe = (t,ids) => (ids||[]).map(id=>t?.ramais.find(r=>r.id===id)).filter(Boolean);

/* ---------- dados de exemplo (gerados em relação à data de hoje) ---------- */
function exemplo(seed=11, defs=null){
  const r = rng(seed), T0 = hoje(), cur = safraIni(T0);
  const def = (defs||[['Talhão A',12,'João'],['Talhão B',9,'Pedro'],['Talhão C',6,'João']]).map(([nome,n,res])=>({nome,n,res}));
  const talhoes = def.map(d=>({id:uid(), nome:d.nome, res:d.res, ramais:Array.from({length:d.n},(_,i)=>{
    const a0 = 85 + Math.floor(r()*30);
    const hist = [{data:`${cur-1}-08-20`, arv:a0, motivo:'Contagem inicial'}];
    const k = r();   // ~85% dos ramais recontados antes da safra atual; os demais ficam com contagem antiga
    if (k<0.85) hist.push({data:`${cur}-08-${10+Math.floor(r()*15)}`, arv:k<0.45? a0-1-Math.floor(r()*5) : a0, motivo:k<0.45?(r()<0.6?'Mortalidade':'Árvore quebrada'):'Recontagem'});
    return {id:uid(), cod:'R-'+String(i+1).padStart(2,'0'), hist};
  })}));
  const estrias=[], producao=[], vendas=[], caixa=[], comp=[], agg={};
  for (const y of [cur-1, cur]) {
    talhoes.forEach((t,i) => {
      const fim = y===cur ? (i===2 ? addD(T0,-18) : T0) : `${y+1}-08-31`;   // Talhão C com estria atrasada, para demonstrar o alerta
      const meio = Math.ceil(t.ramais.length/2), grupos=[t.ramais.slice(0,meio), t.ramais.slice(meio)];
      let d = addD(`${y}-09-01`, i*3+1);
      while (d <= fim) {
        grupos.forEach((g,gi) => {
          const dg = addD(d,gi); if (dg > fim) return;
          const qtd = sum(g,arv), dias = Math.round(qtd/(470+r()*130)*2)/2 || 0.5;
          estrias.push({id:uid(),data:dg,talhao:t.nome,ramais:g.map(x=>x.id),qtd,resineiro:t.res,dias});
          const fator = 0.16*(0.35+0.65*SAFRA[+dg.slice(5,7)-1])*(0.9+0.2*r());
          const k = dg.slice(0,7); agg[k] ??= {kg:{},est:0,dias:0};
          agg[k].kg[t.nome] = (agg[k].kg[t.nome]||0) + qtd*fator; agg[k].est += qtd; agg[k].dias += dias;

  let estoque = 0, n = 0;

    estoque += kgMes;
    const pd = (dia,cat,desc,v) => { const dt=`${k}-${dia}`; if (dt<=T0) caixa.push({id:uid(),data:dt,tipo:'d',cat,desc,valor:Math.round(v)}); };
    if (k.endsWith('-09')) pd('05','Arrendamento','Arrendamento da área',4500);

    pd('15','Combustível/frete','Diesel e frete',300+r()*150);
    pd('20','Sacos e materiais','Sacos e materiais',kgMes*0.05+80);

    n++;

      const kg = Math.round(estoque*0.9/10)*10;
      const nv={id:uid(),data:dv,comprador:compradores[n%3],kg,preco:+(5.3+r()*0.8).toFixed(2),comNota:true,nf:null,recs:[]};

  if (estoque > 800) vendas.push({id:uid(),data:addD(T0,-5),comprador:'Coop. Serra Verde',kg:Math.round(estoque*0.6/10)*10,preco:6.05,comNota:true,nf:null,recs:[],venc:addD(T0,15)});
  vendas.push({id:uid(),data:addD(T0,-2),comprador:'Seu Antônio (vizinho)',kg:150,preco:5.50,comNota:false,nf:null,recs:[{id:uid(),data:addD(T0,-2),valor:400,forma:'Dinheiro'}],venc:addD(T0,10)});
  const ym = T0.slice(0,7);
  for (let i=0;i<6;i++){

    const pc = (dia,tipo,cat,desc,v) => { const dt=`${m}-${dia}`; if (dt>T0) comp.push({id:uid(),data:dt,tipo,cat,desc,valor:Math.round(v/10)*10}); };
    pc('05','d','Mão de obra','Diárias de resineiros',3900*sz);
    pc('10','d','Pasta estimulante','Pasta estimulante',950*sz);
    pc('15','d','Combustível/frete','Diesel e frete',400);
    if (mo===9) pc('05','d','Arrendamento','Arrendamento da área',4500);
    if (i%2===1) pc('22','r','Venda de resina','Venda prevista (~2.500 kg, líquido)',2500*5.9*0.9837*sz);

  return {demo:true, floresta:'Fazenda Capão Alto', regime:'funrural', saldoInicial:9000, ideal:14,
    talhoes:talhoes.map(({res,...t})=>t), estrias, producao, vendas, caixa, comp};
}

/* ---------- cálculos ---------- */
const inSafra = y => x => safraIni(x.data)===y;
const totPaineis = () => sum(S.talhoes, painT);
function tot(y){
  const f = inSafra(y);
  const cx=S.caixa.filter(f), pr=S.producao.filter(f), es=S.estrias.filter(f), ve=S.vendas.filter(f);
  const desp=sum(cx.filter(x=>x.tipo==='d'),x=>x.valor), outras=sum(cx.filter(x=>x.tipo==='r'),x=>x.valor);
  const vendido=sum(ve,totalV), liquido=sum(ve,liqV), kgProd=sum(pr,x=>x.kg), kgVend=sum(ve,x=>x.kg);
  const nEst=sum(es,x=>x.qtd), dias=sum(es,x=>x.dias), pain=totPaineis(), receita=liquido+outras;
  return {desp,outras,vendido,liquido,contrib:vendido-liquido,aReceber:sum(ve,saldoV),kgProd,kgVend,nEst,dias,receita,
    lucro:receita-desp, kgPainel:pain?kgProd/pain:0, kgEstria:nEst?kgProd/nEst:0, estDia:dias?nEst/dias:0,
    custoKg:kgProd?desp/kgProd:0, precoMedio:kgVend?vendido/kgVend:0, precoLivre:kgVend?liquido/kgVend:0, custoPainel:pain?desp/pain:0};
}
const estoque = () => sum(S.producao,x=>x.kg) - sum(S.vendas,x=>x.kg);
const saldoAtual = () => S.saldoInicial + sum(S.caixa,x=>x.tipo==='r'?x.valor:-x.valor) + sum(S.vendas,recV);
const nfPend = () => S.vendas.filter(v=>v.comNota && !v.nf).length;
function fluxo(meses=6){
  const T0=hoje(), ym=T0.slice(0,7); let saldo=saldoAtual();
  const out=[];
  for (let i=0;i<meses;i++){
    const m=addM(ym,i); const noMes = d => (d<T0 ? ym : d.slice(0,7)) === m;
    const ent = sum(S.comp.filter(c=>c.tipo==='r'&&noMes(c.data)),c=>c.valor) + sum(S.vendas.filter(v=>saldoV(v)>0&&noMes(v.venc||T0)),saldoV);
    const sai = sum(S.comp.filter(c=>c.tipo==='d'&&noMes(c.data)),c=>c.valor);
    saldo += ent - sai;
    out.push({m, lbl:MESES[+m.slice(5,7)-1], ent, sai, saldo});
  }
  return out;
}
/* kg de uma coleta rateado entre os ramais coletados, pelo nº de árvores */
function kgRamal(t, r, filtro){
  return sum(S.producao.filter(p=>p.talhao===t.nome && p.ramais?.includes(r.id) && filtro(p)), p=>{
    const tt=sum(ramsDe(t,p.ramais),arv); return tt? p.kg*arv(r)/tt : 0; });
}
function ramStats(t, r, y=safraIni(hoje())){
  const T0=hoje();

  const ult=es.at(-1)?.data||null, desde=ult?diff(ult,T0):null;
  const cur=es.filter(inSafra(y)), ints=cur.slice(1).map((e,i)=>diff(cur[i].data,e.data));
  const kg=kgRamal(t,r,inSafra(y));
  return {r, arv:arv(r), ult, desde, atraso:desde==null?null:desde-S.ideal, prox:ult?addD(ult,S.ideal):null,
    medio:ints.length?sum(ints,x=>x)/ints.length:null, n:cur.length, kg, kgArv:arv(r)?kg/arv(r):0,
    gEst:cur.length&&arv(r)?kg/(arv(r)*cur.length)*1000:0, cont:diff(contData(r),T0)};
}
function statusTalhoes(){
  return S.talhoes.map(t=>{

    const atrasados=rs.filter(s=>s.atraso>0);
    const meds=rs.filter(s=>s.medio!=null);
    return {t, rs, atrasados, atraso: com.length? Math.max(...com.map(s=>s.atraso)) : null,
      ult: com.length? com.map(s=>s.ult).sort().at(-1) : null,
      prox: com.length? com.map(s=>s.prox).sort()[0] : null,
      medio: meds.length? sum(meds,s=>s.medio)/meds.length : null,

  });
}

function niceMax(v){ if(!(v>0)) return 1; const p=10**Math.floor(Math.log10(v)); for(const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if(m*p>=v*1.02) return m*p; return 10*p; }
function chart(o){
  const W=340, H=o.h||170, hasR=(o.lines||[]).some(l=>l.axis==='r'), pl=36, pr=hasR?36:10, pt=10, pb=22;
  const iw=W-pl-pr, ih=H-pt-pb, n=o.labels.length, bw=iw/Math.max(n,1);
  const ax = side => {
    const v=[...(side==='l'?(o.bars||[]).flatMap(b=>b.vals):[]), ...(o.lines||[]).filter(l=>(l.axis||'l')===side).flatMap(l=>l.vals), ...(o.refs||[]).filter(r=>(r.axis||'l')===side).map(r=>r.v)].filter(x=>x!=null&&isFinite(x));
    const mx=niceMax(Math.max(0,...v)), mn=Math.min(0,...v)<0? -niceMax(-Math.min(...v)) : 0;
    return {mn,mx,y:x=>pt+ih*(1-(x-mn)/(mx-mn||1))};
  };
  const L=ax('l'), R=hasR?ax('r'):null;
  let g='';
  for(let i=0;i<=3;i++){ const yy=pt+ih*i/3, vl=L.mx-(L.mx-L.mn)*i/3;
    g+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}"/><text x="${pl-4}" y="${yy+3}" text-anchor="end">${(o.fmtL||kfmt)(vl)}</text>`;
    if(R){ const vr=R.mx-(R.mx-R.mn)*i/3; g+=`<text x="${W-pr+4}" y="${yy+3}">${(o.fmtR||kfmt)(vr)}</text>`; } }
  if(L.mn<0) g+=`<line x1="${pl}" x2="${W-pr}" y1="${L.y(0)}" y2="${L.y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  const bars=o.bars||[], k=bars.length, gw=bw*(k>1?0.78:0.62);
  bars.forEach((b,j)=>b.vals.forEach((v,i)=>{ if(v==null) return;
    const x=pl+i*bw+(bw-gw)/2+j*gw/k, y0=L.y(0), y1=L.y(v);
    g+=`<rect x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(gw/k-1).toFixed(1)}" height="${Math.max(Math.abs(y0-y1),v?1:0).toFixed(1)}" rx="2" fill="${(b.cols&&b.cols[i])||b.color}"/>`; }));
  (o.refs||[]).forEach(r=>{ const A=r.axis==='r'?R:L, yy=A.y(r.v);
    g+=`<line x1="${pl}" x2="${W-pr}" y1="${yy}" y2="${yy}" stroke="${r.color}" stroke-width="1.5" stroke-dasharray="5 4"/>`; });
  (o.lines||[]).forEach(l=>{ const A=l.axis==='r'?R:L; let d='', pen=false;
    l.vals.forEach((v,i)=>{ if(v==null){pen=false;return;} const x=pl+i*bw+bw/2, y=A.y(v); d+=(pen?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); pen=true; });
    g+=`<path d="${d}" fill="none" stroke="${l.color}" stroke-width="2.2" ${l.dash?'stroke-dasharray="4 3"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(l.dots) l.vals.forEach((v,i)=>{ if(v!=null) g+=`<circle cx="${(pl+i*bw+bw/2).toFixed(1)}" cy="${A.y(v).toFixed(1)}" r="3" fill="var(--surface)" stroke="${l.color}" stroke-width="2"/>`; }); });
  const step=Math.ceil(n/12);
  o.labels.forEach((t,i)=>{ if(i%step===0) g+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(t)}</text>`; });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title||'')}">${g}</svg>`;
}

      <div class="card kpi"><div class="l">Lucro na safra</div><div class="v ${lucro>=0?'up':'down'}">${brl(lucro)}</div></div>
      <div class="card kpi"><div class="l">Saldo em caixa</div><div class="v ${saldo>=0?'':'down'}">${brl(saldo)}</div></div>
      <div class="card kpi"><div class="l">A receber</div><div class="v warn">${brl(aRec)}</div></div>
    </div>
  </section>
  ${rows.length?`<section class="card sec">
    <h3>Saldo projetado (6 meses)</h3>
    ${chart({title:'Saldo projetado por fazenda',labels,lines:[...rows.map((r,i)=>({vals:r.fx.map(x=>x.saldo),color:cor(i),dash:true})),{vals:labels.map((_,i)=>t(r=>r.fx[i].saldo)),color:'var(--pine)',dots:true}],h:190})}
    ${legend([...rows.map((r,i)=>({c:cor(i),t:esc(r.f.nome),dash:1})),{c:'var(--pine)',t:'Total',ln:1}])}
  </section>
  <section class="card sec">
    <h3>Comparativo entre fazendas</h3>
    <div class="tbl"><table><thead><tr><th>Fazenda</th><th>kg safra</th><th>kg/árv.</th><th>Preço livre</th><th>Lucro</th><th>Saldo</th><th>A receber</th><th>Alertas</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td><button type="button" class="lnk" data-faz="${r.f.id}">${esc(r.f.nome)}</button></td><td>${num(r.T.kgProd)}</td><td>${num(r.arv?r.T.kgProd/r.arv:0,2)}</td><td>${brl(r.T.precoLivre)}</td>
      <td class="${r.T.lucro>=0?'up':'down'}">${brl(r.T.lucro)}</td><td>${brl(r.saldo)}</td><td>${brl(r.aRec)}</td>
      <td>${[r.atras?`<span class="pill pend">${r.atras} ramais atrasados</span>`:'', r.nfp&&mod('nfe')?`<span class="pill nfp">${r.nfp} NF-e</span>`:''].join('')||'—'}</td></tr>`).join('')}
    <tr><td><b>Total</b></td><td><b>${num(kg)}</b></td><td><b>${num(arvs?kg/arvs:0,2)}</b></td><td><b>${brl(kgV?liq/kgV:0)}</b></td><td><b>${brl(lucro)}</b></td><td><b>${brl(saldo)}</b></td><td><b>${brl(aRec)}</b></td><td></td></tr>
    </tbody></table></div>
    <p class="note">A visão geral só consulta. Para lançar dados, toque no nome da fazenda. Os registros de cada fazenda continuam separados.</p>
  </section>`:''}`;
},

inicio(){
  const T=tot(CUR), fx=fluxo(6), st=statusTalhoes(), T0=hoje();
  const atrasados=st.filter(s=>s.atraso>0);
  const prox=S.comp.filter(c=>c.data>=T0 && diff(T0,c.data)<=10).sort((a,b)=>a.data.localeCompare(b.data));
  const minS=Math.min(...fx.map(f=>f.saldo));
  const mesAtual=new Date().getMonth(), ini='JFMAMJJASOND';
  const alertas=[
    ...(mod('nfe')&&nfPend()?[`<div><span><b>${nfPend()} venda${nfPend()>1?'s':''}</b> aguardando emissão de NF-e</span></div>`]:[]),
    ...(mod('floresta')?atrasados:[]).map(s=>`<div style="--c:${s.atraso>4?'var(--bad)':'var(--amber)'}"><span><b>${esc(s.t.nome)}</b>: ${s.atrasados.length} ramal${s.atrasados.length>1?'is':''} com estria atrasada (até ${s.atraso} dias)</span></div>`),
    ...(mod('floresta')?st.filter(s=>s.contVelha):[]).map(s=>`<div style="--c:var(--muted)"><span><b>${esc(s.t.nome)}</b>: ${s.contVelha} ramal${s.contVelha>1?'is':''} sem recontagem de árvores há mais de 6 meses</span></div>`),
    ...(mod('caixa')?prox:[]).map(c=>`<div style="--c:${c.tipo==='d'?'var(--bad)':'var(--good)'}"><span>${fdata(c.data)} · ${esc(c.desc)}: <b>${c.tipo==='d'?'−':'+'} ${brl(c.valor)}</b></span></div>`)
  ];
  return `
  <section class="sec">
    <div class="sec-h"><h2>Mercado hoje</h2><span class="tag">${MERCADO.atualizado}</span></div>
    <div class="grid3">
      <div class="card q"><span class="l">Dólar</span><span class="v">${brl(MERCADO.dolar.v)}</span>${delta(MERCADO.dolar.d)}</div>
      <div class="card q"><span class="l">Euro</span><span class="v">${brl(MERCADO.euro.v)}</span>${delta(MERCADO.euro.d)}</div>
      <div class="card q res"><span class="l">Goma resina /kg</span><span class="v">${brl(MERCADO.resina.v)}</span>${delta(MERCADO.resina.d)}</div>
    </div>
    <p class="note">A resina é cotada em dólar: dólar alto costuma puxar o preço pago ao produtor. Seu preço médio na safra: <b>${brl(T.precoMedio)}/kg</b>, livre de ${REG[S.regime].nome==='Funrural'?'Funrural':'contribuição'}: <b class="liv">${brl(T.precoLivre)}/kg</b>.</p>
  </section>
  ${alertas.length?`<section class="card sec"><h3>Atenção nos próximos dias</h3><div class="alert">${alertas.join('')}</div></section>`:''}
  <section class="sec">
    <div class="sec-h"><h2>Safra ${safraLbl(CUR)} até agora</h2></div>
    <div class="kpis">
      ${mod('floresta')?`<div class="card kpi"><div class="l">Produtividade</div><div class="v">${num(T.kgPainel,2)} <small>kg/árvore</small></div></div>
      <div class="card kpi"><div class="l">Por estria</div><div class="v">${num(T.kgEstria*1000,0)} <small>g/estria</small></div></div>`:''}
      ${mod('caixa')?`<div class="card kpi"><div class="l">Saldo em caixa</div><div class="v ${saldoAtual()>=0?'up':'down'}">${brl(saldoAtual())}</div></div>
      <div class="card kpi"><div class="l">Menor saldo previsto (6 meses)</div><div class="v ${minS>=0?'':'down'}">${brl(minS)}</div></div>`:''}
    </div>
  </section>
  <section class="sec">
    <div class="sec-h"><h2>Calendário da safra</h2><span class="tag">Sul e Sudeste</span></div>
    <div class="card">
      <div class="cal">${SAFRA.map((v,i)=>`<div style="background:color-mix(in srgb, var(--amber) ${Math.round(v*85)}%, var(--line));${i===mesAtual?'outline:2px solid var(--pine);':''}color:${v>.6?'var(--surface)':'var(--muted)'}">${ini[i]}</div>`).join('')}</div>
      <p class="note" style="margin-top:8px">Cor mais forte = mais resina por estria. O mês atual está marcado.</p>
    </div>
  </section>
  <section class="sec">
    <h2>Dicas de cultivo e resinagem</h2>
    <div class="card tips">${DICAS.map(d=>`<div class="tip"><span class="mes">${d.m}</span><div><b>${d.t}</b><span>${d.s}</span></div></div>`).join('')}</div>
  </section>`;
},

caixa(){
  const fx=fluxo(6), minS=Math.min(...fx.map(f=>f.saldo)), T0=hoje();
  const lista = modoCaixa==='real'
    ? [...S.caixa].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,25)
    : [...S.comp, ...S.vendas.filter(v=>saldoV(v)>0).map(v=>({id:v.id,venda:true,data:v.venc||T0,tipo:'r',cat:'Venda de resina',desc:`A receber de ${v.comprador}`,valor:saldoV(v)}))].sort((a,b)=>a.data.localeCompare(b.data));
  return `
  <section class="sec">
    <h2>Fluxo de caixa previsto</h2>
    <div class="kpis">
      <div class="card kpi"><div class="l">Saldo hoje</div><div class="v ${saldoAtual()>=0?'up':'down'}">${brl(saldoAtual())}</div></div>
      <div class="card kpi"><div class="l">Saldo em ${fx.at(-1).lbl}</div><div class="v ${fx.at(-1).saldo>=0?'':'down'}">${brl(fx.at(-1).saldo)}</div></div>
    </div>
    <div class="card sec">
      ${chart({title:'Fluxo de caixa previsto',labels:fx.map(f=>f.lbl),bars:[{vals:fx.map(f=>f.ent),color:'var(--good)'},{vals:fx.map(f=>f.sai),color:'var(--bad)'}],lines:[{vals:fx.map(f=>f.saldo),color:'var(--amber)',axis:'r',dots:true}],h:190})}
      ${legend([{c:'var(--good)',t:'Entradas previstas'},{c:'var(--bad)',t:'Saídas previstas'},{c:'var(--amber)',t:'Saldo projetado (eixo direito)',ln:1}])}
      <p class="note">Calculado a partir do saldo de hoje, dos compromissos lançados e das vendas a receber. ${minS<0?`<b class="down">O saldo fica negativo em ${fx.find(f=>f.saldo<0).lbl}.</b>`:`Menor saldo previsto: <b>${brl(minS)}</b>.`}</p>
    </div>
  </section>
  <section class="card sec">
    <div class="seg" data-grp="modo"><button type="button" data-modo="real" aria-pressed="${modoCaixa==='real'}">Realizado</button><button type="button" data-modo="comp" aria-pressed="${modoCaixa==='comp'}">Compromissos futuros</button></div>
    <div class="seg"><button type="button" data-tipo="d" aria-pressed="${tipoLanc==='d'}">Saída</button><button type="button" data-tipo="r" aria-pressed="${tipoLanc==='r'}">Entrada</button></div>
    <form id="fCaixa">
      <label>${modoCaixa==='real'?'Data':'Vencimento'}<input id="cData" type="date" value="${modoCaixa==='real'?T0:addD(T0,30)}" required></label>
      <label>Valor (R$)<input id="cValor" type="number" step="0.01" min="0" inputmode="decimal" required></label>
      <label class="full">Categoria<select id="cCat">${(tipoLanc==='d'?CATS_D:CATS_R).map(c=>`<option>${c}</option>`).join('')}</select></label>
      <label class="full">Descrição<input id="cDesc" placeholder="${modoCaixa==='real'?'Ex.: diária de resineiro':'Ex.: parcela do arrendamento'}"></label>
      <button class="btn full">${modoCaixa==='real'?'Lançar':'Agendar compromisso'}</button>
    </form>
  </section>
  <section class="card list">${lista.map(x=>`
    <div class="row"><span class="t">${esc(x.desc||x.cat)}</span><span class="a ${x.tipo==='d'?'down':'up'}">${x.tipo==='d'?'−':'+'} ${brl(x.valor)}</span>
    <span class="s">${fdata(x.data)} · ${esc(x.cat)}${modoCaixa==='comp'&&!x.venda?` · <button type="button" class="lnk" data-realizar="${x.id}">marcar como pago</button>`:''}${x.venda?' · ver em Vendas':''}</span></div>`).join('') || `<p class="note">${modoCaixa==='real'?'Nenhum lançamento ainda.':'Nenhum compromisso futuro. Agende salários, insumos e vendas previstas para ver o fluxo.'}</p>`}
  </section>`;
},

floresta(){
  const T0=hoje();
  talSel = talByNome(talSel)? talSel : S.talhoes[0]?.nome;
  const t=talByNome(talSel);
  const sub = `<div class="seg">${[['ramais','Talhões e ramais'],['apontar','Apontar'],['estrias','Estrias']].map(([k,l])=>`<button type="button" data-fl="${k}" aria-pressed="${flMode===k}">${l}</button>`).join('')}</div>`;
  const chipsTal = (attr='tal', sel=talSel) => `<div class="chips">${S.talhoes.map(x=>`<button type="button" data-${attr}="${esc(x.nome)}" aria-pressed="${x.nome===sel}">${esc(x.nome)}</button>`).join('')}</div>`;
  const nRam = sum(S.talhoes,x=>x.ramais.length);
  const head = `
  <section class="sec">
    <div class="sec-h"><h2>Floresta · ${esc(fazAtual()?.nome||'')}</h2><span class="tag">${S.talhoes.length} talhões · ${nRam} ramais · ${num(totPaineis())} árvores</span></div>
    ${sub}
  </section>`;
  const situ = s => s.ult==null ? '<span class="pill sem">Sem estria</span>' : s.atraso>0 ? `<span class="pill ${s.atraso>4?'late':'pend'}">${s.atraso}d atraso</span>` : '<span class="pill ok">Em dia</span>';

  if (flMode==='ramais') {
    const rs = t? t.ramais.map(r=>ramStats(t,r)) : [];
    const sel = t?.ramais.find(r=>r.id===ramSel);
    return head + `
  <section class="card sec">
    <div class="sec-h"><h3>Ramais do talhão</h3></div>
    ${chipsTal()}
    ${t?`<div class="kpis">
      <div class="card kpi" style="background:var(--bg)"><div class="l">Árvores (painéis)</div><div class="v">${num(painT(t))}</div></div>
      <div class="card kpi" style="background:var(--bg)"><div class="l">Produtividade na safra</div><div class="v">${num(sum(rs,s=>s.kg)/(painT(t)||1),2)} <small>kg/árvore</small></div></div>
    </div>
    <div class="tbl"><table><thead><tr><th>Ramal</th><th>Árvores</th><th>Contagem</th><th>Última estria</th><th>kg/árv.</th><th>g/estria</th></tr></thead><tbody>
    ${rs.map(s=>`<tr><td><button type="button" class="lnk" data-ram="${s.r.id}">${esc(s.r.cod)}</button></td><td>${num(s.arv)}</td>
      <td class="${s.cont>180?'warn':''}">há ${s.cont}d</td><td>${s.ult?fdata(s.ult)+' ':''}${situ(s)}</td><td><b>${num(s.kgArv,2)}</b></td><td>${num(s.gEst)}</td></tr>`).join('') || '<tr><td colspan="6">Nenhum ramal cadastrado.</td></tr>'}
    </tbody></table></div>
    <p class="note">Toque no ramal para atualizar o número de árvores. Contagens com mais de 180 dias ficam em destaque. A coleta do talhão é rateada entre os ramais coletados pelo nº de árvores.</p>`
    :'<p class="note">Cadastre o primeiro talhão abaixo.</p>'}
  </section>
  ${sel?`<section class="card sec" id="cardRam">
    <div class="sec-h"><h3>${esc(t.nome)} · ${esc(sel.cod)}</h3><button type="button" class="lnk" data-ram="">Fechar</button></div>
    <form id="fCont">
      <label>Nova contagem (árvores)<input id="kArv" type="number" min="0" inputmode="numeric" value="${arv(sel)}" required></label>
      <label>Data<input id="kData" type="date" value="${T0}" required></label>
      <label class="full">Motivo<select id="kMot"><option>Mortalidade</option><option>Árvore quebrada</option><option>Recontagem</option><option>Novos painéis abertos</option></select></label>
      <button class="btn full">Atualizar contagem</button>
    </form>
    <div class="list">${[...sel.hist].reverse().map((h,i,a)=>{ const ant=a[i+1]; const d=ant? h.arv-ant.arv : null;
      return `<div class="row"><span class="t">${num(h.arv)} árvores</span><span class="a ${d<0?'down':d>0?'up':''}">${d==null?'':(d>0?'+':'')+num(d)}</span><span class="s">${fdata(h.data)}/${h.data.slice(2,4)} · ${esc(h.motivo)}</span></div>`; }).join('')}</div>
  </section>`:''}
  <section class="card sec">
    <h3>Cadastrar</h3>
    ${t?`<form id="fRam">
      <label>Novo ramal em ${esc(t.nome)}<input id="rCod" placeholder="Ex.: R-${String(t.ramais.length+1).padStart(2,'0')}" value="R-${String(t.ramais.length+1).padStart(2,'0')}" required></label>
      <label>Árvores contadas<input id="rArv" type="number" min="1" inputmode="numeric" required></label>
      <button class="btn full">Adicionar ramal</button>
    </form>`:''}
    <form id="fTal">
      <label class="full">Novo talhão<input id="tNome" placeholder="Ex.: Talhão D" required></label>
      <button class="btn full ghost">Adicionar talhão</button>
    </form>
  </section>`;
  }

  if (flMode==='apontar') {
    apTal = talByNome(apTal)? apTal : talSel;
    const ta=talByNome(apTal), rs=ta? ta.ramais.map(r=>ramStats(ta,r)) : [];
    if (!apSel) apSel = new Set(rs.filter(s=> opTipo==='coleta' || s.desde==null || s.desde>=S.ideal-2).map(s=>s.r.id));
    const recent=[...S.estrias.map(e=>({...e,k:'Estria'})),...S.producao.map(p=>({...p,k:'Coleta'}))].sort((a,b)=>b.data.localeCompare(a.data)).slice(0,8);
    return head + `
  <section class="card sec">
    <div class="seg"><button type="button" data-op="estria" aria-pressed="${opTipo==='estria'}">Estria</button><button type="button" data-op="coleta" aria-pressed="${opTipo==='coleta'}">Coleta</button></div>
    ${chipsTal('aptal', apTal)}
    ${ta?`<form id="fAp">
      <div class="full sec" style="gap:6px">
        <div class="sec-h"><span class="note">${opTipo==='estria'?'Pré-selecionados os ramais com estria vencendo.':'Marque os ramais coletados.'}</span>
          <span><button type="button" class="lnk" data-apall="1">Todos</button> · <button type="button" class="lnk" data-apall="0">Nenhum</button></span></div>
        <div class="rams">${rs.map(s=>`<label class="ram"><input type="checkbox" name="ram" value="${s.r.id}" ${apSel.has(s.r.id)?'checked':''}>
          <span><b>${esc(s.r.cod)}</b> · ${num(s.arv)} árv.<small>${s.ult?`estria há ${s.desde}d`:'sem estria'}</small></span></label>`).join('')}</div>
        <div class="box" id="apSum"></div>
      </div>
      <label>Data<input id="aData" type="date" value="${T0}" required></label>
      ${opTipo==='estria'?`
      <label>Dias trabalhados<input id="aDias" type="number" step="0.5" min="0.5" inputmode="decimal" value="1" required></label>
      <label class="full">Resineiro<input id="aRes" list="resineiros" placeholder="Ex.: João" required></label>
      <datalist id="resineiros">${[...new Set(S.estrias.map(e=>e.resineiro))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`
      :`<label>Resina coletada (kg)<input id="aKg" type="number" min="1" inputmode="numeric" required></label>`}
      <button class="btn full">${opTipo==='estria'?'Registrar estria':'Registrar coleta'}</button>
    </form>`:'<p class="note">Cadastre talhões e ramais primeiro.</p>'}
  </section>
  <section class="card sec"><h3>Últimos apontamentos</h3><div class="list">${recent.map(x=>{ const tx=talByNome(x.talhao), rr=ramsDe(tx,x.ramais);
    return `<div class="row"><span class="t">${x.k} · ${esc(x.talhao)}</span><span class="a">${x.k==='Estria'?num(x.qtd)+' árv.':num(x.kg)+' kg'}</span>
    <span class="s">${fdata(x.data)} · ${rr.length===tx?.ramais.length?'todos os ramais':rr.map(r=>esc(r.cod)).join(', ')}${x.k==='Estria'?` · ${esc(x.resineiro)} · ${num(x.qtd/x.dias)} estrias/dia`:''}</span></div>`; }).join('')}</div></section>`;
  }

  // estrias: situação e intervalo realizado vs ideal por ramal
  const st=statusTalhoes();
  const rsSel = t? t.ramais.map(r=>ramStats(t,r,safraSel)) : [];
  const res={}; S.estrias.filter(inSafra(safraSel)).forEach(e=>{ res[e.resineiro]??={n:0,d:0}; res[e.resineiro].n+=e.qtd; res[e.resineiro].d+=e.dias; });
  return head + `
  <section class="sec">
    <div class="sec-h"><h3>Situação por talhão</h3>
      <label style="flex-direction:row;align-items:center;gap:6px">Intervalo ideal <input id="ideal" type="number" min="7" max="30" value="${S.ideal}" style="width:64px;padding:6px"> dias</label></div>
    <div class="tstat">${st.map(s=>`
      <div class="card tst ${s.atraso>4?'crit':s.atraso>0?'late':''}">
        <h3>${esc(s.t.nome)} <span class="note" style="font-weight:400">· ${s.t.ramais.length} ramais · ${num(painT(s.t))} árv.</span></h3>
        <div class="big">${s.ult==null?'<span class="note">Sem estrias</span>': s.atrasados.length?`<span class="${s.atraso>4?'down':'warn'}">${s.atrasados.length} ramal${s.atrasados.length>1?'is':''} atrasado${s.atrasados.length>1?'s':''}</span>`:'<span class="up">Em dia</span>'}</div>
        ${s.ult?`<span class="note">${s.atrasados.length?`Maior atraso: <b>${s.atraso} dias</b> · `:''}Próxima estria: <b>${fdata(s.prox)}</b></span>
        <span class="note">Intervalo médio na safra: <b class="${s.medio>S.ideal+1?'warn':''}">${s.medio?num(s.medio,1):'–'} dias</b> vs ${S.ideal} ideal</span>`:''}
      </div>`).join('')}</div>
  </section>
  <section class="card sec">
    <div class="sec-h"><h3>Intervalo médio por ramal vs ideal</h3>${chipsSafra()}</div>
    ${chipsTal()}
    ${rsSel.some(s=>s.medio!=null)? chart({title:'Intervalo médio por ramal',labels:rsSel.map(s=>s.r.cod.replace('R-','')),bars:[{vals:rsSel.map(s=>s.medio),color:'var(--pine)',cols:rsSel.map(s=>s.medio>S.ideal+2?'var(--bad)':s.medio>S.ideal?'var(--amber)':'var(--pine)')}],refs:[{v:S.ideal,color:'var(--fg)'}],fmtL:v=>num(v)+'d',h:170})
      + legend([{c:'var(--pine)',t:'No prazo'},{c:'var(--amber)',t:'Até 2 dias acima'},{c:'var(--bad)',t:'Mais de 2 dias acima'},{c:'var(--fg)',t:`Ideal (${S.ideal} dias)`,dash:1}])
      : '<p class="note">Registre ao menos duas estrias nos ramais deste talhão para ver os intervalos.</p>'}
  </section>
  <section class="card sec">
    <h3>Produtividade da equipe · safra ${safraLbl(safraSel)}</h3>

let aberta=null;
function proxNumero(){ return S.vendas.reduce((m,v)=>v.nf? Math.max(m,v.nf.numero):m,0)+1; }
const UFS='AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO'.split(' ');
const soDig = x => String(x||'').replace(/\D/g,'');
function mascaraDoc(d){ d=soDig(d).slice(0,14);
  return d.length<=11 ? d.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2')
    : d.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\d{4})(\d)/,'$1-$2'); }
function cnpjValido(c){ c=soDig(c); if(c.length!==14||/^(\d)\1+$/.test(c)) return false;
  const dv=n=>{ let s=0,p=n-7; for(let i=0;i<n;i++){ s+=+c[i]*p--; if(p<2) p=9; } const r=s%11; return r<2?0:11-r; };
  return dv(12)===+c[12] && dv(13)===+c[13]; }
/* Consulta pública de CNPJ (dados da Receita Federal): BrasilAPI e, se falhar, Minha Receita */
async function buscarCnpj(cnpj){
  const urls=[`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`,`https://minhareceita.org/${cnpj}`];
  let ultimo;
  for(const u of urls){
    try{
      const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(u,{signal:ctl.signal}); clearTimeout(t);
      if(r.status===404) throw Object.assign(new Error('CNPJ não encontrado na Receita.'),{fim:true});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      const end=[[j.descricao_tipo_de_logradouro,j.logradouro].filter(Boolean).join(' '), j.numero, j.complemento].filter(x=>x&&String(x).trim()).join(', ');
      return { razao:j.razao_social||'', fantasia:j.nome_fantasia||'', situacao:j.descricao_situacao_cadastral||'',
        endereco:end, bairro:j.bairro||'', municipio:j.municipio||'', uf:j.uf||'', cep:j.cep? String(j.cep).replace(/^(\d{5})(\d{3})$/,'$1-$2'):'',
        telefone:j.ddd_telefone_1||'', email:j.email||'', atividade:j.cnae_fiscal_descricao||'' };
    }catch(e){ if(e.fim) throw e; ultimo=e; }
  }
  throw new Error('Não foi possível consultar agora ('+(ultimo?.message||'sem conexão')+'). Preencha manualmente.');
}

        ${dest.email?`<dt>E-mail</dt><dd>${esc(dest.email)}</dd>`:''}
        ${dest.atividade?`<dt>Atividade</dt><dd>${esc(dest.atividade)}</dd>`:''}</dl>
      ${ativa?'':'<span class="note" style="color:var(--bad)">Atenção: CNPJ não está ativo na Receita. Confirme com o comprador antes de emitir.</span>'}
    </div>`;
    ajustaCfop();
  };
  const aviso=(t,erro)=>{ box.innerHTML=`<p class="note" style="${erro?'color:var(--bad)':''}">${esc(t)}</p>`; };
  async function consultar(){
    const d=soDig(docEl.value);
    if(d.length===11){ dest=null; aviso('CPF não tem consulta pública: confira o nome e o endereço com o comprador.'); return; }
    if(!cnpjValido(d)){ dest=null; aviso('CNPJ inválido: confira os números digitados.',true); return; }
    btn.disabled=true; btn.textContent='Buscando…'; aviso('Consultando a Receita Federal…');
    try{ dest=await buscarCnpj(d); mostra(); }
    catch(e){ dest=null; aviso(e.message,true); }
    finally{ btn.disabled=false; btn.textContent='Buscar CNPJ'; }
  }
  docEl.addEventListener('input',()=>{ docEl.value=mascaraDoc(docEl.value); if(soDig(docEl.value).length===14) consultar(); });
  btn.onclick=consultar;
  q('#nfUfProd').onchange=e=>{ S.uf=e.target.value; salvar(); ajustaCfop(); };
  mostra();
  dlg.onclose=()=>render();
  dlg.showModal();
  q('#nfCancel').onclick=()=>dlg.close();
  q('#fNf').addEventListener('submit',e=>{
    e.preventDefault(); e.stopPropagation();
    if(!docEl.value.trim()){ docEl.focus(); return; }
    const d=soDig(docEl.value);
    if(d.length===14 && !cnpjValido(d)){ aviso('CNPJ inválido: confira os números digitados.',true); docEl.focus(); return; }
    v.nf={numero:proxNumero(),serie:1,data:q('#nfData').value,doc:mascaraDoc(d),dest,
          cfop:q('#nfCfop').value,chave:chave(),protocolo:'1352'+Date.now().toString().slice(-11)};
    S.compradores[v.comprador]={doc:mascaraDoc(d),dest};
    salvar(); aberta=v.id; dlg.close();
  });
}

/* ---------- conta: helpers ---------- */
const modsHtml = sel => MODS.map(m=>`<label class="ram"><input type="checkbox" name="mod" value="${m.k}" ${sel?.[m.k]?'checked':''}>
  <span><b>${m.n}</b><small>${m.d}${m.req?` · requer ${MODS.find(x=>x.k===m.req).n}`:''}</small></span></label>`).join('');
const fazForm = f => `<form id="fFaz" data-id="${f?.id||''}">
  <h3 class="full">${f?'Editar '+esc(f.nome):'Cadastrar fazenda'}</h3>
  <label class="full">Nome da fazenda<input id="zNome" value="${esc(f?.nome||'')}" required placeholder="Ex.: Fazenda Santa Rita"></label>
  <label>Inscrição Estadual (ICMS)<input id="zIe" inputmode="numeric" value="${esc(f?.ie||'')}" required placeholder="Somente números"></label>
  <label>CPF/CNPJ do produtor<input id="zDoc" inputmode="numeric" value="${esc(f?.doc||'')}" placeholder="Opcional"></label>
  <label>Município<input id="zMun" value="${esc(f?.municipio||'')}" required></label>
  <label>UF<select id="zUf">${UFS.map(x=>`<option ${x===(f?.uf||'PR')?'selected':''}>${x}</option>`).join('')}</select></label>
  <label class="full">Contribuição previdenciária<select id="zReg">${Object.entries(REG).map(([k,r])=>`<option value="${k}" ${k===(f?.dados.regime||'funrural')?'selected':''}>${r.nome} · ${r.desc}</option>`).join('')}</select></label>
  ${f?'':`<label class="ram full"><input type="checkbox" id="zEx"><span><b>Começar com dados de exemplo</b><small>Útil para testar o app. Dá para apagar depois em Conta.</small></span></label>`}
  <p class="err full" id="zErr" hidden></p>
  <button class="btn full">${f?'Salvar alterações':'Cadastrar fazenda'}</button>
  ${f?'<button type="button" class="btn full ghost" data-editfaz="">Cancelar</button>':''}
</form>`;
function usarFazenda(fid){
  DB.sessao.fid = fid; salvar();
  S = fazAtual()?.dados || vazio();
  talSel=null; ramSel=null; apTal=null; apSel=null; aberta=null; safraSel=CUR; fazEdit=null;
  atual = fid==='todas' ? 'geral' : 'inicio';
  render(); window.scrollTo(0,0);
}
function entrar(u){ DB.sessao={uid:u.id, fid:null}; salvar(); S=vazio(); atual='fazendas'; render(); window.scrollTo(0,0); }
/* usuário de exemplo: criado na primeira abertura do app */
const EX = {email:'produtor@exemplo.com', senha:'resina123'};
function garantirExemplo(){
  let u = DB.users.find(x=>x.email===EX.email);
  if (!u) {
    u = {id:uid(), nome:'José Ferreira (exemplo)', email:EX.email, senha:hashS(EX.senha), modulos:{...MOD_PADRAO}, fazendas:[
      {id:uid(), nome:'Fazenda Capão Alto', ie:'254123987', doc:'', municipio:'Itaiópolis', uf:'SC', dados:exemplo(11)},
      {id:uid(), nome:'Sítio Boa Esperança', ie:'9012345678', doc:'', municipio:'Rio Negro', uf:'PR', dados:exemplo(23,[['Talhão 1',8,'Pedro'],['Talhão 2',7,'Luís']])}
    ]};
    DB.users.push(u); salvar();
  }
  return u;
}
function criarDemo(){ entrar(garantirExemplo()); }
garantirExemplo();
/* dependências entre funções: Produção precisa de Floresta; NF-e precisa de Vendas */
function syncMods(src){
  const box=src.closest('.mods'); if(!box) return;
  const cb=k=>box.querySelector(`input[value="${k}"]`);
  MODS.filter(m=>m.req).forEach(m=>{
    if (src.value===m.k && src.checked) cb(m.req).checked=true;
    if (src.value===m.req && !src.checked) cb(m.k).checked=false;
  });
  if (atual==='conta') { const u=usuario(); box.querySelectorAll('input[name=mod]').forEach(c=>u.modulos[c.value]=c.checked); salvar(); }
}

/* ---------- render e eventos ---------- */
const app = document.getElementById('app');
function render(){
  const u=usuario(), fid=DB.sessao?.fid;
  if (!u) atual='login';
  else if (!fid && atual!=='conta') atual='fazendas';
  else if (fid==='todas' && !['geral','conta','fazendas'].includes(atual)) atual='geral';
  if (fazAtual() && NAV_MOD[atual] && !mod(NAV_MOD[atual])) atual='inicio';
  if (atual==='inicio' && !fazAtual()) atual = u? (fid==='todas'?'geral':'fazendas') : 'login';
  app.innerHTML = `<div class="view wrap" style="max-width:none">${V[atual]()}</div>`;
  const f=fazAtual(), g=fid==='todas';
  hdr.innerHTML = !u ? `<h1>Caderno da Resina</h1><p>Gestão simples para quem vive do pinus</p>`
    : `<div class="hrow"><div><h1>${g?'Visão geral':f?esc(f.nome):'Caderno da Resina'}</h1>
        <p>${g? u.fazendas.length+' fazendas · '+esc(u.nome) : f? 'IE '+esc(f.ie)+' · '+esc(f.municipio)+'/'+f.uf : esc(u.nome)}</p></div>
        <div class="hbtn">${(f||g)?'<button type="button" class="btn sm ghost" data-trocar="1">Trocar fazenda</button>':''}<button type="button" class="btn sm ghost" data-conta="1" ${atual==='conta'?'aria-current="page"':''}>Conta</button></div></div>`;
  nav.hidden = !f;
  nav.querySelectorAll('button').forEach(b=>{ b.hidden = !!NAV_MOD[b.dataset.v] && !mod(NAV_MOD[b.dataset.v]);
    if(b.dataset.v===atual) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  document.getElementById('demo').hidden = !(f && S.demo);
  syncAp(); syncVenda();
}
const hdr=document.getElementById('hdr'), nav=document.getElementById('nav');
function ir(v){ atual=v; render(); window.scrollTo(0,0); }
nav.addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) ir(b.dataset.v); });
hdr.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.trocar){ DB.sessao.fid=null; salvar(); S=vazio(); ir('fazendas'); }
  if(b.dataset.conta){ fazEdit=null; ir('conta'); } });
document.getElementById('limpar').addEventListener('click',()=>{ const f=fazAtual(); if(!f) return;
  f.dados = S = {...vazio(), regime:S.regime, ideal:S.ideal}; salvar(); render(); });

app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const d=b.dataset;
  if(d.faz){ usarFazenda(d.faz); }
  else if(d.lmode){ lMode=d.lmode; render(); }
  else if(d.demo){ criarDemo(); }
  else if(d.preencher){ document.getElementById('lEmail').value=EX.email; document.getElementById('lSenha').value=EX.senha; document.getElementById('lEmail').focus(); }
  else if(d.sair){ DB.sessao=null; salvar(); S=vazio(); lMode='entrar'; ir('login'); }
  else if(d.editfaz!==undefined){ fazEdit=d.editfaz||null; limparPend=null; render(); if(fazEdit) document.getElementById('fFaz')?.scrollIntoView({block:'start'}); }
  else if(d.limpafaz!==undefined){
    if(d.ok){ const z=usuario().fazendas.find(x=>x.id===d.limpafaz); z.dados={...vazio(),regime:z.dados.regime,ideal:z.dados.ideal}; if(z.id===DB.sessao.fid) S=z.dados; limparPend=null; salvar(); }
    else limparPend=d.limpafaz||null;
    render(); }
  else if(d.safra){ safraSel=+d.safra; render(); }
  else if(d.tal){ talSel=d.tal; ramSel=null; render(); }
  else if(d.fl){ flMode=d.fl; render(); }
  else if(d.ram!==undefined){ ramSel=d.ram||null; render(); if(ramSel) document.getElementById('cardRam')?.scrollIntoView({block:'nearest'}); }
  else if(d.op){ opTipo=d.op; apSel=null; render(); }
  else if(d.aptal){ apTal=d.aptal; apSel=null; render(); }
  else if(d.apall){ document.querySelectorAll('#fAp input[name=ram]').forEach(c=>c.checked=d.apall==='1'); syncAp(); }
  else if(d.goap){ atual='floresta'; flMode='apontar'; opTipo=d.goap; apSel=null; render(); window.scrollTo(0,0); }
  else if(d.reg){ S.regime=d.reg; salvar(); render(); }
  else if(d.modo){ modoCaixa=d.modo; render(); }
  else if(d.tipo){ tipoLanc=d.tipo; render(); }
  else if(d.realizar){ const i=S.comp.findIndex(c=>c.id===d.realizar); const c=S.comp.splice(i,1)[0];
    S.caixa.push({...c, data: c.data<hoje()? c.data : hoje()}); salvar(); render(); }
  else if(d.emitir){ abrirEmissao(d.emitir); }
  else if(d.comnota){ const v=S.vendas.find(x=>x.id===d.comnota); v.comNota=true; aberta=v.id; salvar(); render(); abrirEmissao(v.id); }
});
app.addEventListener('toggle',e=>{ const d=e.target; if(!d.matches?.('details.venda')) return;
  if(d.open) aberta=d.dataset.venda; else if(aberta===d.dataset.venda) aberta=null; }, true);
app.addEventListener('change',e=>{
  if(e.target.id==='ideal'){ const v=+e.target.value; if(v>=7&&v<=30){ S.ideal=v; salvar(); render(); } }
  if(e.target.name==='ram') syncAp();
  if(e.target.name==='mod') syncMods(e.target);
});
app.addEventListener('submit',e=>{
  e.preventDefault(); const $=id=>document.getElementById(id); const f=e.target.id;
  if(f==='fLogin'){ const email=$('lEmail').value.trim().toLowerCase(), err=$('lErr'), falha=m=>{ err.textContent=m; err.hidden=false; };
    if(lMode==='entrar'){ const u=DB.users.find(x=>x.email===email);
      if(!u || u.senha!==hashS($('lSenha').value)) return falha('E-mail ou senha incorretos.');
      return entrar(u); }
    if(DB.users.some(x=>x.email===email)) return falha('Já existe uma conta com este e-mail. Use Entrar.');
    const modulos=Object.fromEntries(MODS.map(m=>[m.k, !!e.target.querySelector(`input[name=mod][value="${m.k}"]`)?.checked]));
    const u={id:uid(), nome:$('lNome').value.trim(), email, senha:hashS($('lSenha').value), modulos, fazendas:[]};
    DB.users.push(u); return entrar(u); }
  if(f==='fUser'){ usuario().nome=$('uNome').value.trim(); salvar(); render(); return; }
  if(f==='fFaz'){ const u=usuario(), id=e.target.dataset.id, ie=soDig($('zIe').value), err=$('zErr'), falha=m=>{ err.textContent=m; err.hidden=false; };
    if(ie.length<8 || ie.length>14) return falha('A Inscrição Estadual deve ter de 8 a 14 dígitos.');
    const dono=DB.users.find(x=>x.fazendas.some(z=>z.ie===ie && z.id!==id));
    if(dono) return falha(dono.id===u.id ? 'Você já tem uma fazenda com esta Inscrição Estadual.' : 'Esta Inscrição Estadual já está cadastrada em outra conta.');
    const campos={nome:$('zNome').value.trim(), ie, doc:soDig($('zDoc').value), municipio:$('zMun').value.trim(), uf:$('zUf').value};
    if(id){ const z=u.fazendas.find(x=>x.id===id); Object.assign(z,campos); z.dados.regime=$('zReg').value; fazEdit=null; salvar(); render(); return; }
    const dados = $('zEx').checked ? exemplo(2+Math.floor(Math.random()*997)) : vazio(); dados.regime=$('zReg').value;
    const z={id:uid(), ...campos, dados}; u.fazendas.push(z); salvar();
    if(atual==='fazendas') return usarFazenda(z.id);
    render(); return; }
  if(f==='fCaixa'){ const it={id:uid(),data:$('cData').value,tipo:tipoLanc,cat:$('cCat').value,desc:$('cDesc').value.trim(),valor:+$('cValor').value};
    (modoCaixa==='real'?S.caixa:S.comp).push(it); }
  if(f==='fAp'){ const t=talByNome(apTal), ids=[...apSel];
    if(!ids.length){ document.getElementById('apSum').innerHTML='<span class="down">Marque ao menos um ramal.</span>'; return; }
    if(opTipo==='estria') S.estrias.push({id:uid(),data:$('aData').value,talhao:t.nome,ramais:ids,qtd:sum(ramsDe(t,ids),arv),dias:+$('aDias').value,resineiro:$('aRes').value.trim()});
    else S.producao.push({id:uid(),data:$('aData').value,talhao:t.nome,ramais:ids,kg:+$('aKg').value});
    apSel=null; }
  if(f==='fTal'){ const nome=$('tNome').value.trim(); if(!talByNome(nome)){ S.talhoes.push({id:uid(),nome,ramais:[]}); talSel=nome; } }
  if(f==='fRam'){ const t=talByNome(talSel); t.ramais.push({id:uid(),cod:$('rCod').value.trim(),hist:[{data:hoje(),arv:+$('rArv').value,motivo:'Contagem inicial'}]}); }
  if(f==='fCont'){ const t=talByNome(talSel), r=t?.ramais.find(x=>x.id===ramSel);
    if(r){ r.hist.push({data:$('kData').value,arv:+$('kArv').value,motivo:$('kMot').value}); r.hist.sort((a,b)=>a.data.localeCompare(b.data)); } }
  if(f==='fFlo'){ S.floresta=$('fNome').value.trim(); }
  if(f==='fVenda'){
    const v={id:uid(),data:$('vData').value,comprador:$('vComp').value.trim(),kg:+$('vKg').value,preco:+$('vPreco').value,
      comNota:mod('nfe')&&$('vNota')?.value==='1',nf:null,recs:[],venc:$('vVenc').value||hoje()};
    if($('vRec').value==='1') v.recs.push({id:uid(),data:v.data,valor:liqV(v),forma:'Dinheiro'});
    S.vendas.push(v); aberta=v.id; safraSel=safraIni(v.data); salvar(); render();
    if(v.comNota) abrirEmissao(v.id);
    return;
  }
  if(e.target.classList.contains('fRec')){
    const fm=e.target, el=n=>fm.elements.namedItem(n), v=S.vendas.find(x=>x.id===fm.dataset.id), val=Math.min(+el('val').value, saldoV(v));
    if(val>0){ v.recs.push({id:uid(),data:el('d').value,valor:val,forma:el('f').value}); aberta=v.id; }
  }
  salvar(); render();
});
function syncAp(){
  const t=talByNome(apTal), box=document.getElementById('apSum'); if(!t||!box) return;
  apSel=new Set([...document.querySelectorAll('#fAp input[name=ram]:checked')].map(c=>c.value));
  const rr=ramsDe(t,[...apSel]), a=sum(rr,arv);
  box.innerHTML = rr.length ? `<div class="rec"><span>${rr.length} de ${t.ramais.length} ramais</span><b>${num(a)} árvores${opTipo==='estria'?' = '+num(a)+' estrias':''}</b></div>` : '<span class="note">Nenhum ramal marcado.</span>';
}
function syncVenda(){
  const box=document.getElementById('vPrev'); if(!box) return;
  const kg=+document.getElementById('vKg').value||0, p=+document.getElementById('vPreco').value||0;
  box.innerHTML=`<div class="rec"><span>Preço livre (${REG[S.regime].nome})</span><b class="liv">${brl(livre(p))}/kg</b></div><div class="rec"><span>Você recebe</span><b>${brl(kg*livre(p))}</b></div>`;
}
app.addEventListener('input',e=>{ if(e.target.id==='vKg'||e.target.id==='vPreco') syncVenda(); });
render();
</script>
